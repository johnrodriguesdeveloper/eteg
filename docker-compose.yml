services:
  postgres:
    image: postgres:16-alpine
    container_name: eteg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eteg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eteg}
      POSTGRES_DB: ${POSTGRES_DB:-eteg}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eteg} -d ${POSTGRES_DB:-eteg}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
