services:
  postgres:
    image: postgres:16-alpine
    container_name: eteg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eteg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eteg}
      POSTGRES_DB: ${POSTGRES_DB:-eteg}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eteg} -d ${POSTGRES_DB:-eteg}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: eteg-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eteg}:${POSTGRES_PASSWORD:-eteg}@postgres:5432/${POSTGRES_DB:-eteg}?schema=public
      PORT: 3333
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-3333}
    container_name: eteg-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
